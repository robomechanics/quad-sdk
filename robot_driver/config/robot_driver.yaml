/**/robot_driver:
  ros__parameters:
    robot_driver:
      update_rate: 500.0                       # Control loop rate, Hz
      publish_rate: 500.0                      # State and command publish rate, Hz
      mocap_rate: 360.0                        # Mocap frame rate used for velocity estimates, Hz
      mocap_dropout_threshold: 0.035           # Max mocap gap before dropout, s
      filter_time_constant: 0.01               # Command/filter time constant, s
      input_timeout: 0.2                       # Max command age before timeout, s
      state_timeout: 0.1                       # Max state age before timeout, s
      heartbeat_timeout: 0.2                   # Max heartbeat age before timeout, s

      # Complementary filter state-space coefficients.
      low_pass_a: [1.863081589528582, -0.871860350323577, 1.0, 0.0]
      low_pass_b: [2.0, 0.0]
      low_pass_c: [1.469526956982712, -1.476621472298373]
      low_pass_d: [1.616290836790004]
      high_pass_a: [1.901347508294054, -0.905986628426631, 1.0, 0.0]
      high_pass_b: [0.062500000000000, 0.0]
      high_pass_c: [0.031912805108981, -0.028979795079613]
      high_pass_d: [0.0009996017974875904]

      # EKF biases and noise terms.
      bias_x: -0.10                          # Position bias in x, m
      bias_y: -0.17                          # Position bias in y, m
      bias_z: -0.35                          # Position bias in z, m
      bias_r: -0.0047                        # Roll bias, rad
      bias_p: -0.0079                        # Pitch bias, rad
      bias_w: -0.0082                        # Yaw-rate bias, rad/s
      na: 0.001                              # Accelerometer process noise
      nv: 0.005                              # Velocity process noise
      ng: 0.01                               # Gyro process noise
      ba: 0.001                              # Accelerometer bias noise
      bg: 0.001                              # Gyro bias noise
      nf: 0.1                                # Foot position process noise
      nfk: 0.005                             # Forward-kinematics measurement noise
      ne: 0.005                              # Encoder velocity measurement noise
      nfh: 0.01                              # Foot height measurement noise
      P0: 3.0                                # Initial covariance
      contact_w: 100.0                       # Foot-contact measurement weight
      thresh_out: 10.0                       # Innovation outlier threshold
      foot_radius: 0.022                     # Toe radius, m

      model_path: /root/ros2_ws/src/quad-sdk/robot_driver/include/robot_driver/models/go2/policy.onnx  # Learned-policy ONNX path
      policy_inference_rate: 50.0             # Learned-policy inference rate, Hz
      cmd_vel_filter_const: 0.10              # Low-pass filter constant for twist commands
      cmd_vel_scale: 1.0                      # Scale factor applied to twist commands

    underbrush_swing:
      retract_vel: 15.0                       # Proximal-link retraction speed, rad/s
      tau_push: 2.0                           # Distal-link forward torque, N m
      tau_contact_start: 3.0                  # Contact start torque threshold, N m
      tau_contact_end: 3.0                    # Contact end torque threshold, N m
      min_switch: 0.1                         # Minimum time between contact switches, s
      t_down: 0.135                           # Time before requiring leg extension, s
      t_up: 0.04                              # Time before contact-start detection, s
    
