/**/robot_driver:
  ros__parameters:
    robot_driver:
      update_rate: 500.0
      publish_rate: 500.0
      # Per-foot contact thresholds, quad order [FL, RL, FR, RR].
      # Go2 foot sensors are uncalibrated with per-foot baseline offsets:
      # 2026-09-21 bag 1934 measured swing baselines [11,12,10,16] and
      # policy-PD quiet-stance loads [22,41,20,42]. The old global 30 put the
      # FRONT quiet-stance load (~20) below threshold -> front bits read
      # AIRBORNE for the whole 10 s warmup ("torqued but no contact" = the
      # trained vine-stuck signature) -> rear-leg tuck + fall at walk onset.
      # Schmitt hysteresis on the Go2 foot-force counts. Calibration
      # (operator float test 2026-09-21): unloaded 14-19, solid stance 30-40;
      # bag swing floor 10-16, sagged policy-stance fronts ~20. Bit latches
      # ON above enter, OFF below release; the ambiguous sagged-stance ~20
      # lands inside the band and correctly HOLDS the previous state.
      # Quad order FL,RL,FR,RR.
      foot_contact_thresholds: [25, 25, 25, 25]           # enter
      foot_contact_release_thresholds: [20, 20, 20, 20]   # release
      mocap_rate: 360.0 # This must match the mocap frame rate or velocity estimates will be mis-scaled
      mocap_dropout_threshold: 0.035 # s
      filter_time_constant: 0.01 # s
      input_timeout: 0.2
      state_timeout: 0.1
      heartbeat_timeout: 0.2

      # Complementary filter coefficients in state-space form,
      # which can be computed by c2d(1/s*(1-G(s))) and c2d(s*G(s)),
      # where G(s) is a second-order low-pass filter
      low_pass_a: [1.863081589528582, -0.871860350323577, 1.0, 0.0]
      low_pass_b: [2.0, 0.0]
      low_pass_c: [1.469526956982712, -1.476621472298373]
      low_pass_d: [1.616290836790004]
      high_pass_a: [1.901347508294054, -0.905986628426631, 1.0, 0.0]
      high_pass_b: [0.062500000000000, 0.0]
      high_pass_c: [0.031912805108981, -0.028979795079613]
      high_pass_d: [0.0009996017974875904]

      # EKF noise and bias parameters
      bias_x: -0.10
      bias_y: -0.17
      bias_z: -0.35
      bias_r: -0.0047
      bias_p: -0.0079
      bias_w: -0.0082
      na: 0.001      # accelerometer noise (position process)
      nv: 0.005      # velocity process noise
      ng: 0.01       # gyro noise
      ba: 0.001      # accelerometer bias
      bg: 0.001      # gyro bias
      nf: 0.1        # foot position process noise (high - feet move during swing)
      nfk: 0.005     # forward kinematics measurement noise
      ne: 0.005      # encoder velocity measurement noise
      nfh: 0.01      # foot height measurement noise
      P0: 3.0      # initial covariance (low - GT init is accurate)
      contact_w: 100.0  # weight on foot contact
      thresh_out: 10.0  # innovation outlier rejection threshold
      foot_radius: 0.022 # toe radius

      model_path: /rml/ros2_ws/src/quad-sdk/robot_driver/models/go2/v115_model_49999.onnx # V97 checkpoint 30500; launch files override with the installed share copy
      policy_inference_rate: 50.0  # Hz, rate at which learned policy runs inference (PD tracking runs at update_rate)
      # Underbrush Go2 controllers only. position_pd restores legacy onboard PD.
      underbrush_actuation_mode: clipped_effort
      underbrush_effort_state_timeout: 0.02  # s since last hardware LowState receipt
      cmd_vel_filter_const: 0.10
      cmd_vel_scale: 1.0

    underbrush_swing:
      retract_vel: 18.0 # rad/s retraction speed at proximal link (magnitude)
      tau_push: 12.0 # N m forward torque at distal link (09-08 runs used 8)
      # DIAGNOSTIC: force force_mode always active during swing so retract
      # direction can be visually inspected on empty ground. Restore normal
      # tuning (tau_contact_start=2, tau_contact_end=5) once retract
      # behavior is verified.
      tau_contact_start: 2.5    # 09-08 0131-0159 stiffer bungees (K_O 35); worn bungees 3.5; K_O 21 runs used 3.0
      tau_contact_end: 1.3   # 09-08 K_O 35 runs; K_O 21 runs used 1.1
      min_switch: 0.07 # s minimum time between switching
      t_down: 0.17 # s time before requiring leg extension
      t_up: 0.1 # s time before allowing contact initiation detection
      # Sign of the hip retract direction. +1 for Spirit-convention URDFs
      # (hip axis -y), -1 for URDFs whose hip axis is +y (Go2). Applied
      # as: vel_setpoint = -retract_vel * hip_retract_sign.
      hip_retract_sign: -1.0  # Go2: hip axis is +y in the URDF, needs fli, might need to be flipped back on hardware
    ## Note these quantities are tuned for a gait period of 0.54
    

