mapping:
  grid_map_filters:
    ros__parameters:
      input_topic: /mapping/terrain_map_raw
      output_topic: /mapping/terrain_map
      qos_overrides:
        /mapping/terrain_map_raw:
          subscription:
            reliability: reliable
            durability: transient_local
            history: keep_last
            depth: 1
        /mapping/terrain_map:
          publisher:
            reliability: reliable
            durability: transient_local
            history: keep_last
            depth: 1

      filters:
        filter1:
          # Duplicate layer.
          name: duplicate_z
          type: gridMapFilters/DuplicationFilter
          params:
            input_layer: z
            output_layer: z_finite

        filter2:
          # Fill holes in the map with inpainting.
          name: inpaint
          type: gridMapCv/InpaintFilter
          params:
            input_layer: z
            output_layer: z_inpainted
            radius: 0.1

        filter3:
          # Reduce noise with a radial blurring filter.
          name: mean_in_radius
          type: gridMapFilters/MeanInRadiusFilter
          params:
            input_layer: z_inpainted
            output_layer: z_smooth
            radius: 0.05

        filter4:
          # Compute surface normals.
          name: surface_normals
          type: gridMapFilters/NormalVectorsFilter
          params:
            input_layer: z_inpainted
            output_layers_prefix: normal_vectors_
            radius: 0.1
            normal_vector_positive_axis: z

        filter5:
          # Compute smooth surface normals.
          name: smooth_surface_normals
          type: gridMapFilters/NormalVectorsFilter
          params:
            input_layer: z_smooth
            output_layers_prefix: smooth_normal_vectors_
            radius: 0.2
            normal_vector_positive_axis: z

        filter6:
          # Compute slope from surface normal.
          name: slope
          type: gridMapFilters/MathExpressionFilter
          params:
            output_layer: slope
            expression: acos(normal_vectors_z)

        filter7:
          # Compute roughness as absolute difference from map to smoothened map.
          name: roughness
          type: gridMapFilters/MathExpressionFilter
          params:
            output_layer: roughness
            expression: abs(z_inpainted - z_smooth)

          # # Uncomment to use edges
          # # Edge detection by computing the standard deviation from slope.
          # name: edge_detection
          #   type: gridMapFilters/SlidingWindowMathExpressionFilter
          #   params:
          #     input_layer: slope
          #     output_layer: edges
          #     expression: sqrt(sumOfFinites(square(slope - meanOfFinites(slope))) ./ numberOfFinites(slope)) # Standard deviation
          #     compute_empty_cells: false
          #     edge_handling: crop # options: inside, crop, empty, mean
          #     window_length: 0.1

        filter8:
          # Produce a binary occupancy indicator in z_finite (0 = NaN/hole, 1 = finite).
          # We can't use sumOfFinites/meanOfFinites here because Eigen's redux on a
          # 1x1 NaN matrix returns the NaN element directly (no pairwise op runs),
          # which propagates NaN through any arithmetic. numberOfFinites is safe
          # because it uses (x == x).count() — false-counted-as-0 for NaN.
          name: z_finite_indicator
          type: gridMapFilters/SlidingWindowMathExpressionFilter
          params:
            input_layer: z
            output_layer: z_finite
            expression: numberOfFinites(z)
            compute_empty_cells: true
            edge_handling: empty
            window_size: 1

        filter9:
          # Hole mask = the binary occupancy indicator from filter8.
          # (Was: 1 - abs(z_finite - z_inpainted). That trick required z_finite
          #  to be a finite sentinel like -1000 in holes, which the ROS2
          #  ThresholdFilter API no longer supports — see filter8 comment.)
          name: traversability_hole_mask
          type: gridMapFilters/MathExpressionFilter
          params:
            output_layer: traversability_hole_mask
            expression: z_finite

        filter10:
          # Erode the binary safe mask by one cell to remove the boundary-cell
          # overestimation.
          #
          # The grid map's boundary cells (centers at y = +-0.0875 for the
          # 17.5 cm beam) are marked mask=1 because the raycaster's 1e-5
          # tolerance counts the beam-edge boundary as a hit. But the cell
          # occupies y in [-0.10, -0.075] (using the -y edge as an example),
          # so half of it is off-mesh. atPosition uses nearest-neighbor lookup
          # so the planner sees mask=1 for any point in that range, places the
          # toe near y=-0.093, and the toe sphere (r=0.02) contacts the
          # beam top-side EDGE rather than the flat top -> edge friction is
          # poor and the robot slips laterally over multiple gait cycles.
          #
          # MinInRadius with radius = one cell pulls any boundary cell to 0
          # (since it has at least one NaN/0-mask neighbor). Interior cells
          # stay 1. Net effect: usable foothold corridor shrinks by 2 cells
          # (one each side) but every accepted foothold lands on the flat
          # mesh top instead of the edge.
          name: traversability_erode_boundary
          type: gridMapFilters/MinInRadiusFilter
          params:
            input_layer: traversability_hole_mask
            output_layer: traversability_hole_mask_filtered
            # Single-cell (4-connected) erosion at the current 0.01 m pitch.
            # 0.011, not 0.01: CircleIterator's <= radius^2 check is on the
            # floating-point edge when radius equals exactly the cell pitch,
            # and floats round different directions on +y vs -y cell centers,
            # so an exact-pitch radius erodes asymmetrically. At 0.011 the
            # 4-neighbors (0.01) are unambiguously inside the disk and the
            # diagonals (~0.01414) are unambiguously outside, so erosion is
            # 4-connected and symmetric, trimming one cell (~1 cm) per side.
            #
            # Erosion depth = how far the toe CENTRE is kept from the beam
            # edge. The binding constraint is the centre, not the sphere: a
            # sphere resting on a flat top contacts directly beneath its
            # centre, so the equator may overhang without touching the edge.
            # The original failure was a toe centre at y=-0.093 on a beam of
            # half-width 0.0875 -- the centre was off the mesh entirely.
            #
            # 1-cell (~1 cm per side) at the 1 cm map pitch:
            #   15 cm b_beam        -> 13 cm corridor, centre <= 1.0 cm from edge
            #   10 cm beam_world    ->  8 cm corridor, centre <= 1.0 cm from edge
            # Wider settings were tried first: 3-cell gave only a 4 cm corridor
            # on the 10 cm beam and 2-cell gave 6 cm.
            #
            # NOTE the 1 cm edge margin is thin. The toe contacts directly
            # beneath its centre, so contact stays on the flat top as long as
            # the centre is inboard of the edge -- but boundary cells alias by
            # +/-1 cell at this pitch (the beam edge falls mid-cell), so the
            # realised margin varies between roughly 0 and 2 cm along the beam.
            # Halving grid_map_resolution to 0.005 halves that ambiguity.
            #
            # 0.011, not 0.01: CircleIterator's <= radius^2 test sits on the
            # floating-point edge when radius equals an exact multiple of the
            # cell pitch, and rounds differently on +y vs -y cell centres,
            # eroding asymmetrically. At 0.011 the 4-neighbours (0.01) are
            # unambiguously inside the disk and the diagonals (~0.01414)
            # unambiguously outside, so erosion is 4-connected and symmetric.
            # MEASURED (bag 20260810_2057): the footstep planner pins footholds
            # at the corridor boundary -- planned |y| was 0.0374 median / 0.0405
            # max against a 0.040 limit -- because nominal stance (+/-0.15) pulls
            # outward until traversability stops it. So corridor width sets how
            # close feet are PLANNED to the beam edge, and widening the corridor
            # moves footholds outward rather than giving the robot more room.
            #
            # Stance feet then overshoot plan by ~7-12 mm. The two extremes
            # each fail, in opposite ways:
            #
            #   8 cm corridor (0.011): footholds at +/-0.040, touchdown ~0.052
            #     vs a 0.050 edge -- a foot went over at t=11.75 s in bag
            #     20260810_2057, yaw rate spiked to -1.74 rad/s, robot fell.
            #
            #   4 cm corridor (0.031): footholds confined to +/-0.020, so the
            #     left and right foot of a pair converge onto the centreline.
            #     In bag 20260810_2114 the front pair closed to 2 mm apart and
            #     the rear pair from 294 mm to 46 mm -- the legs end up on one
            #     line and cannot swing past each other.
            #
            # On the 10 cm beam, 6 cm (2 cm per side) was the ceiling, and even
            # that left only 8 mm of margin against a measured 8-18 mm p95
            # foothold overshoot -- i.e. no margin at all. Hence the move to the
            # 15 cm b_beam.
            #
            # 3 cm per side on the 15 cm beam gives a 9 cm corridor:
            #   footholds +/-0.045, +18 mm worst-case overshoot -> 0.063
            #   against a 0.075 edge = 12 mm spare, and 9 cm of lateral leg
            #   separation so the pairs cannot converge the way they did at
            #   t=7.10 s in bag 20260810_2114 (front pair 2 mm apart).
            # A 10 cm corridor (2.5 cm/side) was the other candidate but leaves
            # only 7 mm; 9 cm trades 1 cm of width for 5 mm of margin.
            #
            # 0.031 at the 5 mm pitch erodes 6 cells = 3.0 cm, and is clear of
            # the floating-point boundary that an exact pitch multiple (0.030)
            # would sit on -- CircleIterator's <= radius^2 test rounds
            # differently on +y vs -y cell centres there and erodes
            # asymmetrically.
            radius: 0.016

        filter11:
          # Set lower threshold on traversability hole mask.
          name: traversability_hole_mask_lower_threshold
          type: gridMapFilters/ThresholdFilter
          params:
            layer: traversability_hole_mask_filtered
            output_layer: traversability_hole_mask_filtered
            lower_threshold: 0.0
            set_to: 0.0

        filter12:
          # Compute traversability as normalized weighted sum of slope and roughness
          name: traversability
          type: gridMapFilters/MathExpressionFilter
          params:
            output_layer: traversability
            expression: ( 0.5 * (1.0 - (roughness / 0.1)) +
              0.5 * (1.0 - (slope / 0.4) ) )

        filter13:
          # Set lower threshold on traversability.
          name: traversability_lower_threshold
          type: gridMapFilters/ThresholdFilter
          params:
            layer: traversability
            output_layer: traversability
            lower_threshold: 0.0
            set_to: 0.0

        filter14:
          # Add hole mask to traversability, add epsilon to any non-hole features
          name: traversability_apply_hole_mask
          type: gridMapFilters/MathExpressionFilter
          params:
            output_layer: traversability
            expression: (traversability + 2e-2) .* traversability_hole_mask_filtered

        filter15:
          # Set upper threshold on traversability.
          name: traversability_upper_threshold
          type: gridMapFilters/ThresholdFilter
          params:
            layer: traversability
            output_layer: traversability
            upper_threshold: 1.0
            set_to: 1.0 # Other uses: .nan, .inf

        filter16:
          # Delete layers.
          name: delete
          type: gridMapFilters/DeletionFilter
          params:
            layers:
              [
                z_finite,
                traversability_hole_mask,
                traversability_hole_mask_filtered,
              ]

        filter17:
          # Duplicate layer.
          name: duplicate
          type: gridMapFilters/DuplicationFilter
          params:
            input_layer: traversability
            output_layer: traversability_mask

        filter18:
          # Set lower threshold on traversability.
          name: traversability_mask_lower_threshold
          type: gridMapFilters/ThresholdFilter
          params:
            layer: traversability_mask
            output_layer: traversability_mask
            lower_threshold: 0.5 # Note - for now must match /local_footstep_planner/foothold_obj_threshold
            set_to: 0.0
