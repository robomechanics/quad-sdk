mapping:
  grid_map_filters:
    ros__parameters:
      input_topic: /mapping/terrain_map_raw
      output_topic: /mapping/terrain_map
      qos_overrides:
        /mapping/terrain_map_raw:
          subscription:
            reliability: reliable
            durability: transient_local
            history: keep_last
            depth: 1
        /mapping/terrain_map:
          publisher:
            reliability: reliable
            durability: transient_local
            history: keep_last
            depth: 1

      filters:
        filter1:
          # Duplicate layer.
          name: duplicate_z
          type: gridMapFilters/DuplicationFilter
          params:
            input_layer: z
            output_layer: z_finite

        filter2:
          # Fill holes in the map with inpainting.
          name: inpaint
          type: gridMapCv/InpaintFilter
          params:
            input_layer: z
            output_layer: z_inpainted
            radius: 0.1

        filter3:
          # Reduce noise with a radial blurring filter.
          name: mean_in_radius
          type: gridMapFilters/MeanInRadiusFilter
          params:
            input_layer: z_inpainted
            output_layer: z_smooth
            radius: 0.05

        filter4:
          # Compute surface normals.
          name: surface_normals
          type: gridMapFilters/NormalVectorsFilter
          params:
            input_layer: z_inpainted
            output_layers_prefix: normal_vectors_
            radius: 0.1
            normal_vector_positive_axis: z

        filter5:
          # Compute smooth surface normals.
          name: smooth_surface_normals
          type: gridMapFilters/NormalVectorsFilter
          params:
            input_layer: z_smooth
            output_layers_prefix: smooth_normal_vectors_
            radius: 0.2
            normal_vector_positive_axis: z

        filter6:
          # Compute slope from surface normal.
          name: slope
          type: gridMapFilters/MathExpressionFilter
          params:
            output_layer: slope
            expression: acos(normal_vectors_z)

        filter7:
          # Compute roughness as absolute difference from map to smoothened map.
          name: roughness
          type: gridMapFilters/MathExpressionFilter
          params:
            output_layer: roughness
            expression: abs(z_inpainted - z_smooth)

          # # Uncomment to use edges
          # # Edge detection by computing the standard deviation from slope.
          # name: edge_detection
          #   type: gridMapFilters/SlidingWindowMathExpressionFilter
          #   params:
          #     input_layer: slope
          #     output_layer: edges
          #     expression: sqrt(sumOfFinites(square(slope - meanOfFinites(slope))) ./ numberOfFinites(slope)) # Standard deviation
          #     compute_empty_cells: false
          #     edge_handling: crop # options: inside, crop, empty, mean
          #     window_length: 0.1

        filter8:
          # Produce a binary occupancy indicator in z_finite (0 = NaN/hole, 1 = finite).
          # We can't use sumOfFinites/meanOfFinites here because Eigen's redux on a
          # 1x1 NaN matrix returns the NaN element directly (no pairwise op runs),
          # which propagates NaN through any arithmetic. numberOfFinites is safe
          # because it uses (x == x).count() — false-counted-as-0 for NaN.
          name: z_finite_indicator
          type: gridMapFilters/SlidingWindowMathExpressionFilter
          params:
            input_layer: z
            output_layer: z_finite
            expression: numberOfFinites(z)
            compute_empty_cells: true
            edge_handling: empty
            window_size: 1

        filter9:
          # Hole mask = the binary occupancy indicator from filter8.
          # (Was: 1 - abs(z_finite - z_inpainted). That trick required z_finite
          #  to be a finite sentinel like -1000 in holes, which the ROS2
          #  ThresholdFilter API no longer supports — see filter8 comment.)
          name: traversability_hole_mask
          type: gridMapFilters/MathExpressionFilter
          params:
            output_layer: traversability_hole_mask
            expression: z_finite

        filter10:
          # Erode the binary safe mask inward to remove the boundary-cell
          # overestimation. Depth is set by `radius` below (currently 3 cells,
          # 1.5 cm per side).
          #
          # The grid map's boundary cells (centers at y = +-0.0875 for the
          # 17.5 cm beam) are marked mask=1 because the raycaster's 1e-5
          # tolerance counts the beam-edge boundary as a hit. But the cell
          # occupies y in [-0.10, -0.075] (using the -y edge as an example),
          # so half of it is off-mesh. atPosition uses nearest-neighbor lookup
          # so the planner sees mask=1 for any point in that range, places the
          # toe near y=-0.093, and the toe sphere (r=0.02) contacts the
          # beam top-side EDGE rather than the flat top -> edge friction is
          # poor and the robot slips laterally over multiple gait cycles.
          #
          # MinInRadius pulls any cell within `radius` of a NaN/0-mask cell to
          # 0; interior cells stay 1. Net effect: the usable foothold corridor
          # shrinks by the erosion depth on each side, but every accepted
          # foothold lands on the flat mesh top instead of the edge.
          name: traversability_erode_boundary
          type: gridMapFilters/MinInRadiusFilter
          params:
            input_layer: traversability_hole_mask
            output_layer: traversability_hole_mask_filtered
            # Erosion depth = how far the toe CENTRE is kept from the beam
            # edge. The binding constraint is the centre, not the sphere: a
            # sphere resting on a flat top contacts directly beneath its
            # centre, so the equator may overhang without touching the edge.
            # The original failure was a toe centre at y=-0.093 on a beam of
            # half-width 0.0875 -- the centre was off the mesh entirely.
            #
            # Radius convention: N*pitch + 0.001 erodes N cells. The +0.001
            # matters -- CircleIterator's <= radius^2 test sits on the
            # floating-point edge when radius is an exact multiple of the cell
            # pitch, and rounds differently on +y vs -y cell centres, so an
            # exact-multiple radius erodes asymmetrically.
            #
            # At the 5 mm pitch (mapping.py grid_map_resolution), against the
            # 10 cm beam (beam_world_10cm.stl top face: y in +/-0.050 over
            # x in [-0.844, +0.914]):
            #   0.011 -> 2 cells = 1.0 cm/side -> 8.0 cm corridor
            #   0.016 -> 3 cells = 1.5 cm/side -> 7.0 cm corridor
            #   0.031 -> 6 cells = 3.0 cm/side -> 4.0 cm corridor
            #
            # Corridor width sets how far outboard feet are PLANNED, not how
            # much room they have: nominal stance (+/-0.15) pulls outward until
            # traversability stops it, so the planner pins footholds at the
            # corridor boundary.
            #
            # 6.5 cm corridor (3-cell erosion). This is the baseline: 7.5 cm
            # was tried twice and reverted both times, on hardware, because
            # beam ENTRY misses before the extra width ever pays off.
            #
            # THE LADDER IS QUANTISED, AND OFFSET. Erosion removes whole cells,
            # so the corridor moves in 1.0 cm steps -- there is no 7.0 or 7.4
            # setting -- and the step positions are set by where cell centres
            # fall relative to the beam edge, not by the beam edge itself. The
            # mesh is 0.6096 m wide, which at the 5 mm pitch is 121.92 -> 122
            # cells. An EVEN count puts centres at +/-0.0025, +/-0.0075 ...
            # +/-0.0475, +/-0.0525, i.e. half a pitch off zero, so the
            # outermost centre still on the 10 cm beam is 0.0475 and NOT 0.050.
            # Every corridor width is therefore 0.5 cm narrower than the
            # beam-edge arithmetic suggests:
            #   0.006 -> 1 cell -> boundary +/-0.0425 -> 8.5 cm
            #   0.011 -> 2 cells -> boundary +/-0.0375 -> 7.5 cm
            #   0.016 -> 3 cells -> boundary +/-0.0325 -> 6.5 cm   <-- current
            #   0.031 -> 6 cells -> boundary +/-0.0175 -> 3.5 cm
            # CONFIRMED against bag 20260817_2032 at this radius: planned
            # |foothold y| had median exactly 0.0325, spread 0.030-0.0356. The
            # spread is getNearestValidFoothold's sub-cell `offset` realignment
            # (+/- half a pitch), not corridor width. If the mesh or the pitch
            # changes, recompute the phase -- do NOT assume boundary =
            # half_width - erosion.
            #
            # Radius convention: N*pitch + 0.001 erodes N cells. The +0.001
            # matters -- CircleIterator's <= radius^2 test sits on the
            # floating-point edge when radius is an exact multiple of the cell
            # pitch, and rounds differently on +y vs -y cell centres, so an
            # exact-multiple radius erodes asymmetrically.
            #
            # Corridor width sets how far outboard feet are PLANNED, not how
            # much room they have: nominal stance (+/-0.15) pulls outward until
            # traversability stops it, so the planner pins footholds at the
            # corridor boundary.
            #
            # BOTH NEIGHBOURING RUNGS FAIL, IN OPPOSITE WAYS.
            #
            # 6.5 cm (here) fails mid-beam: it leaves the NMPC only a 3.25 cm
            # normal-force roll moment arm. In bag 20260817_2032 that ran out
            # at t~3.3 s -- left legs pinned at u_lb=10 N and right at
            # u_ub=150 N, so the solver started paying for roll with lateral
            # foot forces (friction cone saturated at mu*sqrt2=0.849), and
            # because those act at feet +/-0.2 m in x they twisted the robot:
            # commanded yaw moment went from ~1 to 15 N.m and it toppled at
            # t=3.7 s.
            #
            # 7.5 cm fails at entry. Stance feet overshoot the planned foothold
            # outward in two regimes (measured on 20260817_2032):
            #   beam->beam steps:            -3.0 to  +7.2 mm
            #   platform->beam steps (a leg's first step onto the beam):
            #                               +11.8 to +22.5 mm
            # Against the 0.050 m edge, footholds at +/-0.0375 put the
            # transition steps at ~0.049-0.060 m. Entry is already marginal
            # here at 6.5 cm -- those same four steps landed at
            # 0.050/0.050/0.054/0.054 at t=2.03, 2.21, 2.93, 3.11 -- and 7.5 cm
            # adds ~5 mm to each. Both hardware attempts at 0.011 missed a
            # foothold immediately, at entry, before mid-beam roll authority
            # ever became binding. Bag 20260810_2057 failed the same way at
            # t=11.75 s (foot over the edge, yaw rate spike to -1.74 rad/s).
            #
            # And re-narrowing is worse: 3.5 cm (0.031) confined footholds to
            # +/-0.0175, so the left and right foot of a pair converged onto
            # the centreline and could not swing past each other (bag
            # 20260810_2114: front pair 2 mm apart, rear pair 294 -> 46 mm).
            #
            # CONCLUSION: this knob is exhausted -- 6.5 cm is the floor set by
            # beam-entry foot tracking, and it is below what mid-beam balance
            # wants. Widening only becomes available after the transition step
            # is fixed on the swing side (more swing time for a leg's first
            # step onto the beam, or ramping stance width in over several steps
            # instead of one 0.15 -> 0.0325 jump). The mid-beam roll-authority
            # problem has to be solved elsewhere: NMPC yaw-rate weight
            # (go2.yaml x_weights[12] = 0.01, the smallest in the vector),
            # body height, or gait.
            radius: 0.016

        filter11:
          # Set lower threshold on traversability hole mask.
          name: traversability_hole_mask_lower_threshold
          type: gridMapFilters/ThresholdFilter
          params:
            layer: traversability_hole_mask_filtered
            output_layer: traversability_hole_mask_filtered
            lower_threshold: 0.0
            set_to: 0.0

        filter12:
          # Compute traversability as normalized weighted sum of slope and roughness
          name: traversability
          type: gridMapFilters/MathExpressionFilter
          params:
            output_layer: traversability
            expression: ( 0.5 * (1.0 - (roughness / 0.1)) +
              0.5 * (1.0 - (slope / 0.4) ) )

        filter13:
          # Set lower threshold on traversability.
          name: traversability_lower_threshold
          type: gridMapFilters/ThresholdFilter
          params:
            layer: traversability
            output_layer: traversability
            lower_threshold: 0.0
            set_to: 0.0

        filter14:
          # Add hole mask to traversability, add epsilon to any non-hole features
          name: traversability_apply_hole_mask
          type: gridMapFilters/MathExpressionFilter
          params:
            output_layer: traversability
            expression: (traversability + 2e-2) .* traversability_hole_mask_filtered

        filter15:
          # Set upper threshold on traversability.
          name: traversability_upper_threshold
          type: gridMapFilters/ThresholdFilter
          params:
            layer: traversability
            output_layer: traversability
            upper_threshold: 1.0
            set_to: 1.0 # Other uses: .nan, .inf

        filter16:
          # Delete layers.
          name: delete
          type: gridMapFilters/DeletionFilter
          params:
            layers:
              [
                z_finite,
                traversability_hole_mask,
                traversability_hole_mask_filtered,
              ]

        filter17:
          # Duplicate layer.
          name: duplicate
          type: gridMapFilters/DuplicationFilter
          params:
            input_layer: traversability
            output_layer: traversability_mask

        filter18:
          # Set lower threshold on traversability.
          name: traversability_mask_lower_threshold
          type: gridMapFilters/ThresholdFilter
          params:
            layer: traversability_mask
            output_layer: traversability_mask
            lower_threshold: 0.5 # Note - for now must match /local_footstep_planner/foothold_obj_threshold
            set_to: 0.0
